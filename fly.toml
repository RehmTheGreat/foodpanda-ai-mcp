# fly.io deployment. Run `fly launch --no-deploy` once to set app/region, then `fly deploy`.
app = "foodpanda-ai-mcp"
primary_region = "sin"   # Singapore: closest region to the supported markets

[build]
  dockerfile = "Dockerfile"

[env]
  MCP_TRANSPORT = "http"
  PORT = "3000"
  HOST = "0.0.0.0"
  LOG_LEVEL = "info"
  FOODPANDA_DEFAULT_MARKET = "pk"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Keep one machine warm: MCP sessions live in process memory, so a cold start
  # drops any session that was open.
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
