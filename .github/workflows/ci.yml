name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Typecheck / Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The suite is hermetic: global fetch throws in tests/setup.ts, so this
      # passes with no network access and regardless of upstream availability.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the built server starts and answers an MCP handshake
        run: node scripts/ci-handshake.js

  docker:
    name: Docker build and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: foodpanda-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not enough - prove the container actually serves traffic.
      - name: Run container and check /health
        run: |
          docker run -d --name fp -p 3000:3000 foodpanda-mcp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /tmp/health.json; then
              echo "healthy after ${i}s"; cat /tmp/health.json; exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"; docker logs fp; exit 1

      - name: Container logs
        if: always()
        run: docker logs fp || true

      - name: Stop container
        if: always()
        run: docker rm -f fp || true
